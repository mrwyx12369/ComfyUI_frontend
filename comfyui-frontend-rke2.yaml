
apiVersion: v1
kind: Namespace
metadata:
  name: comfyui
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: comfyui-frontend
  namespace: comfyui
  labels:
    app.kubernetes.io/name: comfyui-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: comfyui-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: comfyui-frontend
    spec:
      imagePullSecrets:
        - name: registry-secret
      containers:
        - name: comfyui-frontend
          image: 172.24.18.56:30500/jxai/comfyui-frontend:latest
          imagePullPolicy: Always
          env:
            - name: COMFYUI_BACKEND
              value: http://172.24.18.52:8188
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: comfyui-frontend
  namespace: comfyui
  labels:
    app.kubernetes.io/name: comfyui-frontend
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: comfyui-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
