<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>锦绣智能ComfyUI多媒体工作台</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <link rel="stylesheet" type="text/css" href="materialdesignicons.min.css" />

    <!-- Fullscreen mode on mobile browsers -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Status bar style (eg. black or transparent) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <style>
      @media (prefers-color-scheme: dark) {
        :root {
          /* Setting it early for background during load */
          --bg-color: #202020;
          --fg-color: #ffffff;
        }
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        background-color: var(--bg-color);
        background-image: var(--bg-img);
        background-position: center;
        background-size: cover;
        background-repeat: no-repeat;
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
    </style>
    <style>
      /* Pre-Vue splash loader — inlined to avoid SPA fallback serving
         index.html instead of CSS on cloud/ephemeral environments */
      #splash-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        contain: strict;
      }
      #splash-loader .splash-wordmark {
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          'Segoe UI', sans-serif;
        font-size: clamp(2rem, 6vw, 4.5rem);
        font-weight: 700;
        letter-spacing: 0;
        line-height: 1.2;
        text-align: center;
        color: currentColor;
        opacity: 0;
        animation: splash-title-in 800ms ease-out forwards;
      }
      @keyframes splash-title-in {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash-loader .splash-wordmark {
          animation: none;
          opacity: 1;
          transform: none;
        }
      }
    </style>
    <link rel="manifest" href="manifest.json" />
  </head>

  <body class="litegraph grid">
    <div
      id="splash-loader"
      role="status"
      aria-label="Loading 锦绣智能多媒体创作平台"
    >
      <div class="splash-wordmark">锦绣智能多媒体创作平台</div>
    </div>
    <script>
      ;(function () {
        var bg, fg
        try {
          bg = localStorage.getItem('comfy-splash-bg')
          fg = localStorage.getItem('comfy-splash-fg')
        } catch (_) {}
        if (!bg || !fg) {
          var isDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
          bg = isDark ? '#202020' : '#f5f5f5'
          fg = isDark ? '#ffffff' : '#000000'
        }
        document.documentElement.style.setProperty('--bg-color', bg)
        document.documentElement.style.setProperty('--fg-color', fg)
        var el = document.getElementById('splash-loader')
        if (el) {
          el.style.background = bg
          el.style.color = fg
        }
      })()
    </script>
    <div id="vue-app"></div>
    <script type="module" src="src/main.ts"></script>
  </body>
</html>
